<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Student Management System{% endblock %}</title>
  <!-- Load main stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- Top navigation bar -->
  <header class="navbar">
    <div class="container nav-content">
      <a href="{{ url_for('dashboard') }}" class="brand">
        <span class="brand-badge">M</span>
        <span>MEVI Student CRM</span>
      </a>

      <!-- Page navigation links -->
      <nav class="nav-links">
        <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
          Dashboard
        </a>
        <a href="{{ url_for('students') }}" class="{% if request.endpoint == 'students' %}active{% endif %}">
          Students
        </a>
      </nav>
    </div>
  </header>

  <!-- Main centered page area -->
  <main class="container main-content">
    <!-- Flash alert messages from Flask -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="alerts">
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
              <span>{{ message }}</span>
              <button type="button" class="alert-close" aria-label="Close">&times;</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Child page content goes here -->
    {% block content %}{% endblock %}
  </main>

  <!-- Simple page footer -->
  <footer class="footer">
    <div class="container">
      <p>MEVI Student Management System</p>
    </div>
  </footer>

  <!-- Load interactive JavaScript -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
